name: Deploy OnlineRepetitor to Tuqo

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-tuqo-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify required build variables
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Missing VITE_SUPABASE_ANON_KEY"; exit 1; }

      - name: Build
        run: npm run build

      - name: Deploy to Tuqo
        run: npx @tuqo/cli deploy ./dist --site "${{ vars.TUQO_SITE_ID }}" --wait
        env:
          TUQO_API_KEY: ${{ secrets.TUQO_API_KEY }}
