# OnlineRepetitor coturn template. Replace the placeholders before deployment.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=REPLACE_WITH_THE_SAME_SECRET_AS_TURN_SHARED_SECRET
realm=turn.example.com
server-name=turn.example.com
stale-nonce
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
min-port=49160
max-port=49200
# For a VPS behind NAT, set its public IP, for example: external-ip=203.0.113.10
# external-ip=YOUR_PUBLIC_IP
# Add cert/pkey after DNS is pointed at the server and a TLS certificate is installed.
# cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem
