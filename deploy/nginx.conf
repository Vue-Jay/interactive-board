server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
  location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable" always; }
  location = /sw.js { try_files $uri =404; add_header Cache-Control "public, max-age=0, must-revalidate" always; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache" always; }
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
}
