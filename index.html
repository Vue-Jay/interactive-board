<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa-icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5355c9" />
    <meta name="description" content="OnlineRepetitor — интерактивная доска для онлайн-занятий, совместной работы и учебных материалов." />
    <title>OnlineRepetitor — интерактивная доска для занятий</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var expected = "175";
        try {
          fetch("/version.json?bootstrap=" + Date.now(), { cache: "no-store" })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (v) {
              if (!v || !v.version || v.version === expected) return;
              var u = new URL(location.href);
              if (u.searchParams.get("_appv") === v.version) return;
              u.searchParams.set("_appv", v.version);
              location.replace(u.toString());
            })
            .catch(function () {});
        } catch (_) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
